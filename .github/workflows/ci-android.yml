name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*', 'pixel-*']
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
      - '.github/scripts/android_ci_metadata.py'
      - '.github/scripts/verify_android_codec.py'
      - '.github/scripts/publish_android_release.py'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
      - '.github/scripts/android_ci_metadata.py'
      - '.github/scripts/verify_android_codec.py'
      - '.github/scripts/publish_android_release.py'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed GitHub release (main pushes publish automatically)
        type: boolean
        default: false
      release_tag:
        description: New v* or pixel-* tag (required when publishing)
        type: string
        default: ''
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Validate build and release metadata
        id: metadata
        env:
          REQUEST_RELEASE: ${{ inputs.publish_release || false }}
          REQUEST_TAG: ${{ inputs.release_tag || '' }}
        run: |
          python3 .github/scripts/android_ci_metadata.py --self-test
          python3 .github/scripts/verify_android_codec.py --self-test
          python3 .github/scripts/publish_android_release.py --self-test
          python3 .github/scripts/android_ci_metadata.py
      - name: Validate version-specific release notes
        if: steps.metadata.outputs.publish_release == 'true'
        run: python3 .github/scripts/publish_android_release.py --check-notes '${{ steps.metadata.outputs.app_version }}'
      - name: Test pairing artwork generation
        run: python3 -I android/tools/pairing-art/test_darken.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.14904198"
      - name: Check native VendorID hook
        run: |
          g++ -std=c++23 -Wall -Wextra -pedantic android/app/src/test/cpp/vendor_hook_test.cpp -o "$RUNNER_TEMP/vendor-hook-test"
          "$RUNNER_TEMP/vendor-hook-test"
      - name: Check spatial audio diagnostics without a device
        run: |
          output="$RUNNER_TEMP/spatial-checks"
          mkdir -p "$output"
          g++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG android/tools/head-tracker-probe/protocol_test.cpp -o "$output/head-tracker"
          "$output/head-tracker"
          g++ -std=c++17 -Wall -Wextra -Werror android/tools/head-tracker-abi-check/abi_check.cpp -o "$output/uhid-abi"
          "$output/uhid-abi"
          "$ANDROID_HOME/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++" \
            -std=c++17 -Wall -Wextra -Werror -c android/tools/head-tracker-abi-check/abi_check.cpp -o "$output/uhid-abi-android.o"
          g++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -DSPATIAL_PROBE_HOST_TEST android/tools/spatial-audio-probe/probe_contract_test.cpp -o "$output/audio-contract"
          "$output/audio-contract"
          g++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -idirafter "$ANDROID_HOME/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            android/tools/spatial-audio-probe/startup_test.cpp -o "$output/audio-startup"
          "$output/audio-startup"
          javac --release 8 -d "$output" android/tools/spatial-audio-inspector/InspectorContract.java android/tools/spatial-audio-inspector/InspectorContractCheck.java
          java -cp "$output" me.kavishdevar.librepods.spatialinspector.InspectorContractCheck
          javac --release 8 -d "$output" android/tools/head-tracker-lease/LeaseState.java android/tools/head-tracker-lease/LeaseStateCheck.java
          java -cp "$output" me.kavishdevar.librepods.headtrackerlease.LeaseStateCheck
          gcc -std=c11 -Wall -Wextra -Werror -UNDEBUG -DSIGNAL_GUARD_HOST_TEST android/tools/head-tracker-lease/signals.c -o "$output/lease-signals"
          "$output/lease-signals"
      - name: Test native audio pipeline with sanitizers
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for suite in native-dongle-hid-tests native-eld-tests native-hook-transaction-tests native-symbol-tests \
            native-pixel17-codec-tests native-pixel17-cohort-tests native-pixel17-registry-tests \
            native-pixel17-wire-tests native-pixel17-contract-tests native-pixel17-vtable-tests \
            native-pixel17-wire-contract-tests native-pixel17-game-host-tests native-pixel17-hci-tests; do
            build="$RUNNER_TEMP/librepods-native/$suite"
            cmake -S "android/tools/$suite" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
            cmake --build "$build" --parallel 2
            ctest --test-dir "$build" --output-on-failure --timeout 30
          done
      - name: Test decoded AAC-ELD quality in S16 and Q31
        run: |
          for wide_pcm in OFF ON; do
            build="$RUNNER_TEMP/librepods-native/native-owned-fdk-tests-$wide_pcm"
            cmake -S android/tools/native-owned-fdk-tests -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DLIBREPODS_PRIVATE_WIDE_PCM="$wide_pcm"
            cmake --build "$build" --parallel 2
            ctest --test-dir "$build" --output-on-failure --timeout 60
          done
      - name: Prepare existing fork signing
        if: >-
          github.repository == 'Ripthulhu/librepods' &&
          steps.metadata.outputs.sign_artifacts == 'true' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ('RELEASE_KEYSTORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Trusted builds require the existing fork signing secrets: ' + ', '.join(missing))
          os.umask(0o077)
          keystore = base64.b64decode(''.join(os.environ['RELEASE_KEYSTORE_FILE'].split()), validate=True)
          if not keystore:
              raise SystemExit('Release keystore is empty')
          pathlib.Path('android/release.keystore').write_bytes(keystore)
          values = {'RELEASE_STORE_FILE': '../release.keystore', **{name: os.environ[name] for name in names[1:]}}
          def escape(value):
              data = value.encode('utf-16-be').hex()
              return ''.join('\\u' + data[index:index+4] for index in range(0, len(data), 4))
          pathlib.Path('android/local.properties').write_text(''.join(f'{name}={escape(value)}\n' for name, value in values.items()))
          PY
          keytool -list -keystore android/release.keystore -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" >/dev/null
      - name: Test, lint and build Android APKs
        working-directory: android
        run: ./gradlew --no-daemon :core:lintDebug :app:verifyPixel
      - name: Verify complete AAC-ELD PCM32 APK payloads
        run: python3 .github/scripts/verify_android_codec.py --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify trusted APK signatures
        if: steps.metadata.outputs.sign_artifacts == 'true'
        run: |
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            signing_details=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$signing_details"
            signer_sha256=$(printf '%s\n' "$signing_details" | awk '/^Signer #[0-9]+ certificate SHA-256 digest: / {print $NF}')
            if [ "$signer_sha256" != 'df20046be1ac11bd7feb5e8d8158fe59c5627210652776f9f974b204191907e2' ]; then
              echo 'Refusing to upload: trusted APKs must use the existing fork signing certificate' >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-results
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/overlay-previews/
            android/app/build/reports/lint-results-debug.*
            android/core/build/reports/lint-results-debug.*
            android/app/build/reports/detekt/
            android/core/build/reports/detekt/
            android/app/build/reports/codec-packaging.json
          if-no-files-found: ignore
      - name: Prepare complete debug download
        run: |
          mkdir -p artifacts/debug
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/debug/
          cp android/app/build/outputs/codec-source/aac-eld-source.tar.gz android/app/build/outputs/codec-source/aac-eld-source.json artifacts/debug/
          (cd artifacts/debug && sha256sum ./*.apk ./*.tar.gz ./*.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: artifacts/debug/*
          if-no-files-found: error
      - name: Verify and checksum release APK
        if: steps.metadata.outputs.publish_release == 'true'
        run: |
          mkdir -p artifacts/release
          apk="artifacts/release/LibrePods.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cp android/app/build/outputs/codec-source/aac-eld-source.tar.gz android/app/build/outputs/codec-source/aac-eld-source.json artifacts/release/
          signing_details=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signing_details"
          signer_sha256=$(printf '%s\n' "$signing_details" | awk '/^Signer #[0-9]+ certificate SHA-256 digest: / {print $NF}')
          if [ "$signer_sha256" != 'df20046be1ac11bd7feb5e8d8158fe59c5627210652776f9f974b204191907e2' ]; then
            echo 'Refusing to publish: APK must use the existing fork signing certificate' >&2
            exit 1
          fi
          (cd artifacts/release && sha256sum ./*.apk ./*.tar.gz ./*.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.publish_release == 'true'
        with:
          name: apk-release
          path: artifacts/release/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f -- android/release.keystore android/local.properties

  release:
    if: needs.build.outputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: android-github-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts
      - name: Publish complete signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: python3 .github/scripts/publish_android_release.py artifacts
