name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*', 'pixel-*']
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
      - '.github/scripts/android_ci_metadata.py'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
      - '.github/scripts/android_ci_metadata.py'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or commit to build
        type: string
        required: true
        default: main
      publish_release:
        description: Publish a signed GitHub prerelease (requires fork signing secrets)
        type: boolean
        default: false
      release_tag:
        description: New v* or pixel-* tag (required when publishing)
        type: string
        default: ''
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      publish_release: ${{ steps.metadata.outputs.publish_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
      - name: Validate build and release metadata
        id: metadata
        env:
          REQUEST_RELEASE: ${{ inputs.publish_release || false }}
          REQUEST_TAG: ${{ inputs.release_tag || '' }}
        run: |
          python3 .github/scripts/android_ci_metadata.py --self-test
          python3 .github/scripts/android_ci_metadata.py
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.14904198"
      - name: Check native VendorID hook
        run: |
          g++ -std=c++23 -Wall -Wextra -pedantic android/app/src/test/cpp/vendor_hook_test.cpp -o "$RUNNER_TEMP/vendor-hook-test"
          "$RUNNER_TEMP/vendor-hook-test"
      - name: Test native audio pipeline with sanitizers
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for suite in native-eld-tests native-hook-transaction-tests native-symbol-tests \
            native-pixel17-codec-tests native-pixel17-cohort-tests native-pixel17-registry-tests \
            native-pixel17-wire-tests native-pixel17-contract-tests native-pixel17-vtable-tests \
            native-pixel17-wire-contract-tests native-pixel17-game-host-tests native-pixel17-hci-tests; do
            build="$RUNNER_TEMP/librepods-native/$suite"
            cmake -S "android/tools/$suite" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
            cmake --build "$build" --parallel 2
            ctest --test-dir "$build" --output-on-failure --timeout 30
          done
      - name: Test decoded AAC-ELD quality
        # Isolated encoder tests: keep combined binaries private and the APK encoder opt-in off.
        run: |
          build="$RUNNER_TEMP/librepods-native/native-owned-fdk-tests"
          cmake -S android/tools/native-owned-fdk-tests -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --output-on-failure --timeout 60
      - name: Test, lint and build Android APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:verifyPixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-results
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/overlay-previews/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare fork release signing
        if: steps.metadata.outputs.publish_release == 'true'
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          names = ('RELEASE_KEYSTORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Signed release requires fork secrets: ' + ', '.join(missing))
          os.umask(0o077)
          keystore = base64.b64decode(''.join(os.environ['RELEASE_KEYSTORE_FILE'].split()), validate=True)
          if not keystore:
              raise SystemExit('Release keystore is empty')
          pathlib.Path('android/release.keystore').write_bytes(keystore)
          values = {'RELEASE_STORE_FILE': '../release.keystore', **{name: os.environ[name] for name in names[1:]}}
          def escape(value):
              data = value.encode('utf-16-be').hex()
              return ''.join('\\u' + data[index:index+4] for index in range(0, len(data), 4))
          pathlib.Path('android/local.properties').write_text(''.join(f'{name}={escape(value)}\n' for name, value in values.items()))
          PY
          keytool -list -keystore android/release.keystore -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" >/dev/null
      - name: Build signed GitHub release APK
        if: steps.metadata.outputs.publish_release == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify and checksum release APK
        if: steps.metadata.outputs.publish_release == 'true'
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          mkdir -p artifacts
          apk="artifacts/LibrePods-v${APP_VERSION}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          signing_details=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signing_details"
          signer_sha256=$(printf '%s\n' "$signing_details" | awk '/^Signer #[0-9]+ certificate SHA-256 digest: / {print $NF}')
          if [ "$signer_sha256" != '041c993537c37f30ccc48a20320562d81d32671a505aac118f0f5bcca4a40227' ]; then
            echo 'Refusing to publish: APK must use the existing fork signing certificate' >&2
            exit 1
          fi
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.publish_release == 'true'
        with:
          name: apk-release
          path: artifacts/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f -- android/release.keystore android/local.properties

  release:
    if: needs.build.outputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts
      - name: Publish signed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
            if [ "$tagged_commit" != "$RELEASE_COMMIT" ]; then
              echo 'Refusing to publish: the release tag points to a different commit' >&2
              exit 1
            fi
          fi
          (cd artifacts && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$RELEASE_COMMIT" \
            --title "LibrePods Pixel $APP_VERSION" \
            --generate-notes --prerelease
